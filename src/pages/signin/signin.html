<!-- Start Sign In Section -->
<section class="py-5 min-vh-100 d-flex align-items-center justify-content-center">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <!-- Glassmorphism Card -->
        <div class="card bg-dark-ops border border-white border-opacity-10 rounded-4 shadow-lg p-4 p-sm-5">
          <!-- Logo & Brand Header -->
          <div class="text-center mb-4">
            <a href="/" onclick="event.preventDefault(); route('/')" class="d-inline-flex align-items-center justify-content-center mb-3 text-decoration-none">
              <span class="fs-4 text-white font-monospace fw-bold me-1">fashion</span>
              <svg class="brand-svg" viewBox="0 0 510 453" xmlns="http://www.w3.org/2000/svg" style="width: 32px; height: 32px;">
                <path d=" M 5 125, L 5 320, 220 445, 280 445, 495 320, 495 120, 280 10, 220 10, z " stroke="#000" stroke-width="13" fill="#000" />
                <path d="M 80 245, L 80 325, 40 300, 40 150, 160 80, 160 370, 120 345, 120 245,z M 80 170, 80 205, 120 205, 120 145,z M 180 70, L 220 45, 250 145, 280 45, 320 70, 320 380, 280 405, 280 165, 270 200, 230 200, 220 165, 220 405, 180 380, z M 380 245, L 380 345, 340 370, 340 80, 460 140, 460 210, 440 220, 460 230, 460 300, 420 325, 420 265, 395 245,z M 380 195,L 395 195, 420 175, 420 165, 380 147,z " fill="#1E88E5" stroke="#1E88E5" stroke-width="5" />
              </svg>
              <span class="fs-4 text-white font-monospace fw-bold ms-1">stowage</span>
            </a>
            <h4 class="text-white fw-bold mb-1">Welcome Back!</h4>
            <p class="text-white-50 fs-7">Please sign in to access your account</p>
          </div>

          <!-- Alert Feedback Container -->
          <div id="signin-alert-container"></div>

          <!-- Sign In Form -->
          <form id="signin-form" novalidate>
            <!-- Email Field -->
            <div class="mb-3">
              <label for="signin-email" class="form-label text-white-50 fs-7">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light-ops text-white-50 border-white border-opacity-25"><i class="bx bx-envelope"></i></span>
                <input
                  type="email"
                  id="signin-email"
                  class="form-control bg-light-ops text-white border-white border-opacity-25 shadow-none"
                  placeholder="name@example.com"
                  required
                />
              </div>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="signin-password" class="form-label text-white-50 fs-7 mb-0">Password</label>
                <a href="#" id="btn-forgot-password" class="text-primary-ops text-decoration-none fs-7">Forgot?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light-ops text-white-50 border-white border-opacity-25"><i class="bx bx-lock-alt"></i></span>
                <input
                  type="password"
                  id="signin-password"
                  class="form-control bg-light-ops text-white border-white border-opacity-25 shadow-none"
                  placeholder="••••••••"
                  required
                />
                <button type="button" id="btn-toggle-signin-password" class="btn btn-outline-secondary bg-light-ops text-white-50 border-white border-opacity-25" title="Toggle password visibility">
                  <i class="bx bx-eye"></i>
                </button>
              </div>
            </div>

            <!-- Remember Me -->
            <div class="form-check mb-4">
              <input class="form-check-input bg-light-ops border-white border-opacity-25" type="checkbox" id="remember-me" checked />
              <label class="form-check-label text-white-50 fs-7" for="remember-me">
                Remember me on this device
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btn-signin-submit" class="btn btn-lighter btn-ecommerco w-100 py-2 text-uppercase fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
              <i class="bx bx-log-in fs-5"></i> Sign In
            </button>
          </form>

          <div class="position-relative my-4 text-center">
            <hr class="border-white border-opacity-10" />
            <span class="position-absolute top-50 start-50 translate-middle px-3 bg-dark-ops text-white-50 fs-7">or continue with</span>
          </div>

          <!-- Social Buttons -->
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-light border-white border-opacity-25 w-50 py-2 fs-7 text-white d-flex align-items-center justify-content-center gap-2">
              <i class="bx bxl-google fs-5 text-danger"></i> Google
            </button>
            <button type="button" class="btn btn-outline-light border-white border-opacity-25 w-50 py-2 fs-7 text-white d-flex align-items-center justify-content-center gap-2">
              <i class="bx bxl-apple fs-5"></i> Apple
            </button>
          </div>

          <!-- Sign Up Redirect Link -->
          <div class="text-center mt-4 pt-2 border-top border-white border-opacity-10">
            <p class="text-white-50 fs-7 mb-0">
              Don't have an account?
              <a href="/signup" onclick="event.preventDefault(); route('/signup')" class="text-white fw-bold text-decoration-none ms-1">Create Account</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- End Sign In Section -->
