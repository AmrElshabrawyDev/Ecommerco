<!-- Start Sign Up Section -->
<section class="py-5 min-vh-100 d-flex align-items-center justify-content-center">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <!-- Glassmorphism Card -->
        <div class="card bg-dark-ops border border-white border-opacity-10 rounded-4 shadow-lg p-4 p-sm-5">
          <!-- Logo & Brand Header -->
          <div class="text-center mb-4">
            <a href="/" onclick="event.preventDefault(); route('/')" class="d-inline-flex align-items-center justify-content-center mb-3 text-decoration-none">
              <span class="fs-4 text-white font-monospace fw-bold me-1">fashion</span>
              <svg class="brand-svg" viewBox="0 0 510 453" xmlns="http://www.w3.org/2000/svg" style="width: 32px; height: 32px;">
                <path d=" M 5 125, L 5 320, 220 445, 280 445, 495 320, 495 120, 280 10, 220 10, z " stroke="#000" stroke-width="13" fill="#000" />
                <path d="M 80 245, L 80 325, 40 300, 40 150, 160 80, 160 370, 120 345, 120 245,z M 80 170, 80 205, 120 205, 120 145,z M 180 70, L 220 45, 250 145, 280 45, 320 70, 320 380, 280 405, 280 165, 270 200, 230 200, 220 165, 220 405, 180 380, z M 380 245, L 380 345, 340 370, 340 80, 460 140, 460 210, 440 220, 460 230, 460 300, 420 325, 420 265, 395 245,z M 380 195,L 395 195, 420 175, 420 165, 380 147,z " fill="#1E88E5" stroke="#1E88E5" stroke-width="5" />
              </svg>
              <span class="fs-4 text-white font-monospace fw-bold ms-1">stowage</span>
            </a>
            <h4 class="text-white fw-bold mb-1">Create an Account</h4>
            <p class="text-white-50 fs-7">Join thousands of fashion enthusiasts today</p>
          </div>

          <!-- Alert Feedback Container -->
          <div id="signup-alert-container"></div>

          <!-- Sign Up Form -->
          <form id="signup-form" novalidate>
            <!-- Full Name Field -->
            <div class="mb-3">
              <label for="signup-fullname" class="form-label text-white-50 fs-7">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light-ops text-white-50 border-white border-opacity-25"><i class="bx bx-user"></i></span>
                <input
                  type="text"
                  id="signup-fullname"
                  class="form-control bg-light-ops text-white border-white border-opacity-25 shadow-none"
                  placeholder="Amr Elshabrawy"
                  required
                />
              </div>
            </div>

            <!-- Email Field -->
            <div class="mb-3">
              <label for="signup-email" class="form-label text-white-50 fs-7">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light-ops text-white-50 border-white border-opacity-25"><i class="bx bx-envelope"></i></span>
                <input
                  type="email"
                  id="signup-email"
                  class="form-control bg-light-ops text-white border-white border-opacity-25 shadow-none"
                  placeholder="name@example.com"
                  required
                />
              </div>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
              <label for="signup-password" class="form-label text-white-50 fs-7">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light-ops text-white-50 border-white border-opacity-25"><i class="bx bx-lock-alt"></i></span>
                <input
                  type="password"
                  id="signup-password"
                  class="form-control bg-light-ops text-white border-white border-opacity-25 shadow-none"
                  placeholder="At least 6 characters"
                  required
                />
                <button type="button" id="btn-toggle-signup-password" class="btn btn-outline-secondary bg-light-ops text-white-50 border-white border-opacity-25" title="Toggle password visibility">
                  <i class="bx bx-eye"></i>
                </button>
              </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="mb-3">
              <label for="signup-confirm-password" class="form-label text-white-50 fs-7">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light-ops text-white-50 border-white border-opacity-25"><i class="bx bx-check-shield"></i></span>
                <input
                  type="password"
                  id="signup-confirm-password"
                  class="form-control bg-light-ops text-white border-white border-opacity-25 shadow-none"
                  placeholder="Re-enter your password"
                  required
                />
              </div>
            </div>

            <!-- Agree to Terms -->
            <div class="form-check mb-4">
              <input class="form-check-input bg-light-ops border-white border-opacity-25" type="checkbox" id="agree-terms" required checked />
              <label class="form-check-label text-white-50 fs-7" for="agree-terms">
                I agree to the <a href="#" class="text-white text-decoration-underline">Terms of Service</a> and <a href="#" class="text-white text-decoration-underline">Privacy Policy</a>
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btn-signup-submit" class="btn btn-lighter btn-ecommerco w-100 py-2 text-uppercase fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
              <i class="bx bx-user-plus fs-5"></i> Create Account
            </button>
          </form>

          <!-- Sign In Redirect Link -->
          <div class="text-center mt-4 pt-3 border-top border-white border-opacity-10">
            <p class="text-white-50 fs-7 mb-0">
              Already have an account?
              <a href="/signin" onclick="event.preventDefault(); route('/signin')" class="text-white fw-bold text-decoration-none ms-1">Sign In</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- End Sign Up Section -->
