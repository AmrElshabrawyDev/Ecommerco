<!-- Start Header / Breadcrumbs -->
<header class="text-white d-flex">
  <div class="container border-bottom mt-5 pb-4 pt-5">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
      <div>
        <h2 class="mb-1 text-capitalize fw-bold">Shopping Cart</h2>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="/" class="text-white-50 text-decoration-none">Home</a></li>
            <li class="breadcrumb-item active text-white" aria-current="page">Cart</li>
          </ol>
        </nav>
      </div>
      <div class="d-flex align-items-center gap-2 bg-dark-ops px-3 py-2 rounded-3 border border-white border-opacity-10">
        <i class="bx bx-shopping-bag bx-sm text-primary-ops"></i>
        <span id="cart-header-count" class="fw-bold">0 items in your cart</span>
      </div>
    </div>
  </div>
</header>
<!-- End Header -->

<!-- Start Cart Section -->
<section class="py-5">
  <div class="container">
    <!-- Main Cart Container (Dynamic) -->
    <div id="cart-main-container">
      <!-- Loading Skeleton / Content will be dynamically rendered here -->
      <div class="text-center py-5">
        <div class="spinner-border text-light" role="status">
          <span class="visually-hidden">Loading cart...</span>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- End Cart Section -->
