<!-- Start Header / Breadcrumbs -->
<header class="text-white d-flex">
  <div class="container border-bottom mt-5 pb-4 pt-5">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
      <div>
        <h2 class="mb-1 text-capitalize fw-bold">Explore Our Brands</h2>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="/" class="text-white-50 text-decoration-none">Home</a></li>
            <li class="breadcrumb-item active text-white" aria-current="page">Brands</li>
          </ol>
        </nav>
      </div>

      <!-- Brand Search Input -->
      <div class="search-box position-relative" style="min-width: 280px;">
        <input
          type="text"
          id="brand-search-input"
          class="form-control bg-dark-ops text-white border-white border-opacity-25 ps-4 pe-5 py-2 rounded-pill shadow-none"
          placeholder="Search brand name..."
        />
        <i class="bx bx-search position-absolute end-0 top-50 translate-middle-y me-3 text-white-50 fs-5"></i>
      </div>
    </div>
  </div>
</header>
<!-- End Header -->

<!-- Start Brands Section -->
<section class="py-5">
  <div class="container">
    <!-- Dynamic Brands Container -->
    <div id="brands-main-container">
      <div class="text-center py-5">
        <div class="spinner-border text-light" role="status">
          <span class="visually-hidden">Loading brands...</span>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- End Brands Section -->
